process:
  project_name: "chatbot-evaluation"
  workflow_type: SIMULATOR  # Must be SIMULATOR for conversation testing
  evaluation_params:
    attempts: 3
    batch_size: 10

evaluation:
  evaluators:
    - JUDGE
    - REFERENCE
  providers:
    - openai
    - ionos
  metrics_map:
    appointment_type: EXACT
    date: LEVENSHTEIN
    time: TOKEN_BASED

reference_data:
  path: "../data/conversation_script.json"
  data: {}

endpoint:
  base_url: "http://127.0.0.1:8000"
  url_path: "/chat"
  api_key: ""
  bearer_token: ""
  model_id: "meta-llama/Meta-Llama-3.1-8B-Instruct"
  default_request_payload_template:
    message: "${user_message}"
    payload: "${request_payload}"
  default_response_payload_template:
    agent_reply: "${generated_reply}"
    generated_metadata: "${metadata}"

repository:
  type: FILESYSTEM
  project_id: ""
  database_name: ""
  source: "LOCAL"